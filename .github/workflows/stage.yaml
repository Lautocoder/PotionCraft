name: Stage

on: [push]

jobs:
  lint-dockerfile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [./frontend/Dockerfile, ./api/Dockerfile]
    steps:
    - uses: actions/checkout@v4
    - uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ matrix.dockerfile }}
        failure-threshold: error

  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: frontend
            context: ./frontend
            tag: "sevrius/potioncraft:frontend"
          - name: api
            context: ./api
            tag: "sevrius/potioncraft:api"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Build and push ${{ matrix.service.name }}
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.service.context }}
        push: true
        tags: ${{ matrix.service.tag }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: ${{ matrix.service.tag }}
        format: json
        output: trivy-report.json
        exit-code: '1'
        ignore-unfixed: true
        severity: CRITICAL,HIGH

    - name: Publish Trivy report to summary
      if: always()
      run: |
        echo "## 🔍 Trivy scan: ${{ matrix.service.name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
        if [ "$COUNT" = "0" ]; then
          echo "✅ Aucune vulnérabilité CRITICAL/HIGH détectée." >> $GITHUB_STEP_SUMMARY
        else
          echo "**$COUNT vulnérabilité(s) détectée(s)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Sévérité | CVE | Paquet | Version | Corrigé en |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|--------|---------|------------|" >> $GITHUB_STEP_SUMMARY
          jq -r '.Results[]?.Vulnerabilities[]? | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") |"' trivy-report.json >> $GITHUB_STEP_SUMMARY
        fi